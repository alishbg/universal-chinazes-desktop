name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Create version tag
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if (-not (git ls-remote --tags origin "refs/tags/$tag")) {
            git tag $tag
            git push origin $tag
          }
      - name: Build Setup.exe
        run: npm run dist
      - name: Publish release files
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $version --notes "Universal Chinazes for Windows"
          }
          gh release upload $tag `
            "release/Universal-Chinazes-Setup-$version.exe" `
            "release/Universal-Chinazes-Setup-$version.exe.blockmap" `
            "release/latest.yml" `
            --clobber
